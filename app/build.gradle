apply plugin: 'com.android.application'

// Release signing. Values come from (1) environment variables or (2) a git-ignored
// keystore.properties file in the project root. Nothing secret is stored in this file.
//
// keystore.properties format:
//   storeFile=C:/keys/interview-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signValue = { String envName, String propName ->
    def v = System.getenv(envName)
    return (v != null && !v.isEmpty()) ? v : keystoreProps.getProperty(propName)
}
def releaseStoreFile = signValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile && rootProject.file(releaseStoreFile).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.sussalproductions.interviewsimulator"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sussalproductions.interviewsimulator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Increase versionCode by 1 for every upload to Play Console.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            // Store native libraries uncompressed and page aligned (needed for 16 KB page size devices).
            useLegacyPackaging = false
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

if (!hasReleaseSigning) {
    logger.warn("Release signing is not configured. bundleRelease will produce an UNSIGNED .aab. " +
            "Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD " +
            "or create keystore.properties (see GUIDE.md).")
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// Generated by "npx cap sync android". It adds the Capacitor plugin modules.
apply from: 'capacitor.build.gradle'
