apply plugin: 'com.android.application'

// Release signing. Values come from (1) environment variables or (2) a git-ignored
// keystore.properties file in the project root. Nothing secret is stored in this file.
//
// keystore.properties format:
//   storeFile=C:/keys/interview-upload.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signValue = { String envName, String propName ->
    def v = System.getenv(envName)
    return (v != null && !v.isEmpty()) ? v : keystoreProps.getProperty(propName)
}
def releaseStoreFile = signValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile && rootProject.file(releaseStoreFile).exists() &&
        releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// AdMob App ID for the manifest, read from src/config/ads.js (the only place ad IDs live), so the
// manifest and the web app always use the same set. Debug: TEST_IDS. Release: PRODUCTION_IDS only
// when RELEASE_ADS=true, else TEST_IDS. A release build with RELEASE_ADS=true stops while the
// production App ID is still a placeholder.
def adsConfigText = rootProject.file('src/config/ads.js').text
def admobAppId = { String setName ->
    def m = (adsConfigText =~ /(?s)${setName}\s*=\s*\{.*?appId:\s*'([^']+)'/)
    if (!m.find()) throw new GradleException("src/config/ads.js: no appId found in ${setName}")
    return m.group(1)
}
def releaseAds = System.getenv('RELEASE_ADS') == 'true'
def testAdmobAppId = admobAppId('TEST_IDS')
def productionAdmobAppId = admobAppId('PRODUCTION_IDS')
def productionAppIdValid = productionAdmobAppId ==~ /ca-app-pub-\d{16}~\d{10}/ &&
        !productionAdmobAppId.startsWith('ca-app-pub-3940256099942544')
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }
    if (releaseAds && buildsRelease && !productionAppIdValid) {
        throw new GradleException("RELEASE_ADS=true but PRODUCTION_IDS.appId in src/config/ads.js is not a real " +
                "AdMob App ID (\"${productionAdmobAppId}\"). Paste the real IDs (RELEASE_CHECKLIST.md) or build without RELEASE_ADS.")
    }
}

android {
    namespace = "com.sussalproductions.interviewsimulator"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sussalproductions.interviewsimulator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must grow with every build: CI sets VERSION_CODE to the run number (local
        // builds use 1). A new number also makes the phone refresh the app icon after an update.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        // versionName: the "version" in package.json (one place). versionCode: CI run number.
        versionName new groovy.json.JsonSlurper().parse(rootProject.file('package.json')).version
        manifestPlaceholders = [admobAppId: testAdmobAppId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: testAdmobAppId]
        }
        release {
            manifestPlaceholders = [admobAppId: releaseAds ? productionAdmobAppId : testAdmobAppId]
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        jniLibs {
            // Store native libraries uncompressed and page aligned (needed for 16 KB page size devices).
            useLegacyPackaging = false
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

if (!hasReleaseSigning) {
    logger.warn("Release signing is not configured. bundleRelease will produce an UNSIGNED .aab. " +
            "Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD " +
            "or create keystore.properties (see GUIDE.md).")
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// Generated by "npx cap sync android". It adds the Capacitor plugin modules.
apply from: 'capacitor.build.gradle'
